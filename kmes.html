<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>KMES Canteen Menu</title>

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <h2 class="logo">
            KMES Canteen
        </h2>

        <div class="nav-right">

            <a href="orders.html" class="orders-link">
                My Orders
            </a>

            <a href="cart.html" class="cart-link">
                🛒 Cart
                <span id="cart-count">0</span>
            </a>

        </div>

    </nav>


    <!-- Menu -->

    <section class="menu-section">

        <div class="menu-heading">

            <div>

                <p class="section-label">
                    KMES CANTEEN
                </p>

                <h2>
                    Today's Menu
                </h2>

            </div>

            <p class="menu-note">
                Freshly available today
            </p>

        </div>


        <!-- Food Items from Django API -->

        <div
            class="food-container"
            id="food-container">

            <p>
                Loading menu...
            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <div class="footer-content">

            <h3>
                KMES Campus Canteen
            </h3>

            <p>
                A simple and convenient way to order food on campus.
            </p>

            <p class="footer-bottom">
                © 2026 KMES Campus Canteen |
                All Rights Reserved
            </p>

        </div>

    </footer>


    <!-- Your JavaScript -->

    <script src="script.js"></script>


    <!-- Load Menu From Django -->

    <script>

        async function loadKMESMenu() {

            const container =
                document.getElementById("food-container");


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/kmes-menu/"
                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load menu"
                    );

                }


                const items =
                    await response.json();


                container.innerHTML = "";


                if (items.length === 0) {

                    container.innerHTML = `
                        <p>
                            No menu items available today.
                        </p>
                    `;

                    return;

                }


                items.forEach(function(item) {

                    const foodItem =
                        document.createElement("div");

                    foodItem.className =
                        "food-item";


                    foodItem.innerHTML = `

                        <div class="food-image">
                            🍽️
                        </div>


                        <div class="food-details">

                            <h3>
                                ${item.name}
                            </h3>


                            <div class="food-bottom">

                                <strong>
                                    ₹${item.price}
                                </strong>


                                <button
                                    class="add-button"
                                    onclick="addToCart(
    ${item.id},
    '${item.name}',
    ${item.price},
    '${item.canteen}'
)">

                                    Add +

                                </button>

                            </div>

                        </div>

                    `;


                    container.appendChild(foodItem);

                });


            } catch (error) {

                console.error(
                    "Menu loading error:",
                    error
                );


                container.innerHTML = `

                    <p>
                        Unable to load menu.
                        Please make sure the Django
                        server is running.
                    </p>

                `;

            }

        }


        loadKMESMenu();

    </script>


</body>

</html>
