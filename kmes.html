<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    <title>KMES Canteen Menu</title>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">
<script src="student-auth.js"></script>

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 flex items-center justify-between bg-white px-6 py-4 shadow-md">

        <h2 class="text-xl font-bold text-orange-600">
            KMES Canteen
        </h2>

        <div class="flex items-center gap-6">

            <a
                href="orders.html"
                class="font-medium text-gray-700 transition hover:text-orange-600">
                My Orders
            </a>

            <a
                href="cart.html"
                class="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-white transition hover:bg-orange-600">
                🛒 Cart
                <span
                    id="cart-count"
                    class="ml-1 rounded-full bg-white px-2 py-0.5 text-sm text-orange-600">
                    0
                </span>
            </a>

        </div>

    </nav>


    <!-- Menu Section -->
    <section class="mx-auto max-w-6xl px-6 py-12">

        <!-- Menu Heading -->
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">

            <div>

                <p class="text-sm font-bold uppercase tracking-widest text-orange-500">
                    KMES Canteen
                </p>

                <h2 class="mt-2 text-3xl font-bold text-gray-900">
                    Today's Menu
                </h2>

            </div>

            <p class="text-sm text-gray-500">
                Freshly available today
            </p>

        </div>


        <!-- Food Items from Django API -->
        <div
            id="food-container"
            class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

            <div class="col-span-full py-10 text-center text-gray-500">
                Loading menu...
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="mt-12 bg-gray-900 px-6 py-10 text-center text-white">

        <div class="mx-auto max-w-4xl">

            <h3 class="text-xl font-bold">
                KMES Campus Canteen
            </h3>

            <p class="mt-3 text-gray-400">
                A simple and convenient way to order food on campus.
            </p>

            <p class="mt-6 border-t border-gray-700 pt-6 text-sm text-gray-500">
                © 2026 KMES Campus Canteen |
                All Rights Reserved
            </p>

        </div>

    </footer>


    <!-- Existing JavaScript -->
    <script src="script.js"></script>


    <!-- Load Menu From Django -->
    <script>

        async function loadKMESMenu() {

            const container =
                document.getElementById("food-container");

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/kmes-menu/"
                );

                if (!response.ok) {

                    throw new Error(
                        "Could not load menu"
                    );

                }

                const items =
                    await response.json();

                container.innerHTML = "";


                if (items.length === 0) {

                    container.innerHTML = `
                        <div class="col-span-full py-10 text-center text-gray-500">
                            No menu items available today.
                        </div>
                    `;

                    return;

                }


                items.forEach(function(item) {

                    const foodItem =
                        document.createElement("div");


                    foodItem.className =
                        "overflow-hidden rounded-2xl bg-white shadow-md transition duration-300 hover:-translate-y-1 hover:shadow-xl";


                    foodItem.innerHTML = `

                       <!-- Food Image -->
<div class="h-44 overflow-hidden">
    <img
        src="${item.name.toLowerCase().includes('pav bhaji')
            ? 'images/pavbhaji.jpg'
            : item.name.toLowerCase().includes('dhokla')
            ? 'images/dhokla.jpg'
           : item.name.toLowerCase().includes('cutlet')
            ? 'images/cutlet.jpg'

            : item.name.toLowerCase().includes('samosa')
            ? 'images/samosa.jpg'

            : item.name.toLowerCase().includes('vada pav')
            ? 'images/vada pav.jpg'

            : item.name.toLowerCase().includes('noodles')
            ? 'images/noodles.jpg'

            : ''}"
            
        alt="${item.name}"
        class="h-full w-full object-cover"
    >
</div>













                        <!-- Food Details -->
                        <div class="p-5">

                            <h3 class="text-xl font-bold text-gray-900">
                                ${item.name}
                            </h3>


                            <div class="mt-5 flex items-center justify-between">

                                <strong class="text-xl font-bold text-orange-600">
                                    ₹${item.price}
                                </strong>


                                <button
                                    class="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-white transition hover:bg-orange-600 active:scale-95"
                                    onclick="addToCart(
                                        ${item.id},
                                        '${item.name}',
                                        ${item.price},
                                        '${item.canteen}'
                                    )">

                                    Add +

                                </button>

                            </div>

                        </div>

                    `;


                    container.appendChild(foodItem);

                });


            } catch (error) {

                console.error(
                    "Menu loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="col-span-full rounded-xl bg-red-50 p-6 text-center text-red-600">

                        <p class="font-semibold">
                            Unable to load menu.
                        </p>

                        <p class="mt-1 text-sm">
                            Please make sure the Django
                            server is running.
                        </p>

                    </div>

                `;

            }

        }


        loadKMESMenu();

    </script>

<script src="script.js"></script>
</body>

</html>
