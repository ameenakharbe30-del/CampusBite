<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="src/output.css">

    <title>GM College Canteen</title>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">


    <!-- Navbar -->
    <nav class="sticky top-0 z-40 flex items-center justify-between bg-white px-6 py-4 shadow-md">

        <h2 class="text-xl font-bold text-orange-600">

            <a
                href="index.html"
                class="transition hover:text-orange-700">
                GM College Canteen
            </a>

        </h2>


        <div class="flex items-center gap-6">

            <a
                href="orders.html"
                class="font-medium text-gray-700 transition hover:text-orange-600">
                My Orders
            </a>


            <a
                href="cart.html"
                class="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-white transition hover:bg-orange-600">

                🛒 Cart

                <span
                    id="cart-count"
                    class="ml-1 rounded-full bg-white px-2 py-0.5 text-sm text-orange-600">
                    0
                </span>

            </a>

        </div>

    </nav>


    <!-- Menu Heading -->
    <section class="mx-auto max-w-6xl px-6 pb-4 pt-12">

        <p class="text-sm font-bold uppercase tracking-widest text-orange-500">
            GM College Canteen
        </p>

        <h1 class="mt-2 text-3xl font-bold text-gray-900 sm:text-4xl">
            Today's Menu
        </h1>

        <p class="mt-3 text-gray-500">
            Freshly available today
        </p>

    </section>


    <!-- Menu -->
    <section class="mx-auto max-w-6xl px-6 pb-16">

        <div
            id="food-container"
            class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

            <div class="col-span-full py-10 text-center text-gray-500">
                Loading menu...
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="bg-gray-900 px-6 py-10 text-center text-white">

        <div class="mx-auto max-w-4xl">

            <h3 class="text-xl font-bold">
                GM College Canteen
            </h3>

            <p class="mt-3 text-gray-400">
                A simple and convenient way to order food on campus.
            </p>

            <p class="mt-6 border-t border-gray-700 pt-6 text-sm text-gray-500">
                © 2026 GM College Canteen |
                All Rights Reserved
            </p>

        </div>

    </footer>


    <!-- Existing JavaScript -->
    <script src="script.js"></script>


    <!-- Load GM Menu From Django -->
    <script>

        async function loadGMMenu() {

            const container =
                document.getElementById("food-container");


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/gm-menu/"
                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load GM menu"
                    );

                }


                const items =
                    await response.json();


                container.innerHTML = "";


                if (items.length === 0) {

                    container.innerHTML = `

                        <div class="col-span-full py-10 text-center text-gray-500">

                            No menu items available today.

                        </div>

                    `;

                    return;

                }


                items.forEach(function(item) {

                    const foodItem =
                        document.createElement("div");


                    foodItem.className =
                        "overflow-hidden rounded-2xl bg-white shadow-md transition duration-300 hover:-translate-y-1 hover:shadow-xl";


                    foodItem.innerHTML = `

                        <!-- Food Image -->
                        <div class="flex h-44 items-center justify-center bg-orange-50 text-6xl">
                            🍽️
                        </div>


                        <!-- Food Details -->
                        <div class="p-5">

                            <h3 class="text-xl font-bold text-gray-900">
                                ${item.name}
                            </h3>


                            <div class="mt-5 flex items-center justify-between">

                                <strong class="text-xl font-bold text-orange-600">
                                    ₹${item.price}
                                </strong>


                                <button
                                    class="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-white transition hover:bg-orange-600 active:scale-95"
                                    onclick="addToCart(
                                        ${item.id},
                                        '${item.name}',
                                        ${item.price},
                                        '${item.canteen}'
                                    )">

                                    Add +

                                </button>

                            </div>

                        </div>

                    `;


                    container.appendChild(foodItem);

                });


            } catch (error) {

                console.error(
                    "GM menu loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="col-span-full rounded-xl bg-red-50 p-6 text-center text-red-600">

                        <p class="font-semibold">
                            Unable to load GM menu.
                        </p>

                        <p class="mt-1 text-sm">
                            Please make sure the Django
                            server is running.
                        </p>

                    </div>

                `;

            }

        }


        loadGMMenu();

    </script>

</body>

</html>
