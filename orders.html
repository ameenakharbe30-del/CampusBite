<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <title>My Orders - KMES Canteen</title>

</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">


    <!-- Navigation -->

    <nav class="bg-white border-b border-gray-200 shadow-sm">

        <div class="max-w-6xl mx-auto px-6 py-4
                    flex items-center justify-between">

            <h2 class="text-2xl font-bold text-orange-600">
                KMES Canteen
            </h2>

            <a href="index.html"
               class="text-gray-600 font-medium
                      hover:text-orange-600 transition">

                ← Back to Menu

            </a>

        </div>

    </nav>



    <!-- Orders -->

    <main class="max-w-6xl mx-auto px-6 py-10">


        <!-- Page Heading -->

        <p class="text-sm font-semibold
                  tracking-widest text-orange-600 mb-2">

            YOUR ORDERS

        </p>


        <h1 class="text-4xl font-bold text-gray-900 mb-3">

            My Orders

        </h1>


        <p class="text-gray-500 mb-8">

            Track your current and previous orders.

        </p>



        <!-- Orders will appear here -->

        <div id="orders-list" class="space-y-6">

            <p class="text-gray-500">
                Loading orders...
            </p>

        </div>


    </main>



    <script src="script.js"></script>



    <!-- Load Orders From Django -->

    <script>

        async function loadOrders() {

            const container =
                document.getElementById("orders-list");


            // Get customer phone number

            const phone =
                localStorage.getItem("customerPhone");


            if (!phone) {

                container.innerHTML = `

                    <div class="bg-white border border-gray-200
                                rounded-2xl p-10 text-center
                                shadow-sm">

                        <h2 class="text-2xl font-bold
                                   text-gray-900 mb-2">

                            No orders found

                        </h2>

                        <p class="text-gray-500 mb-6">

                            Please place an order first.

                        </p>

                        <a href="index.html"
                           class="inline-block bg-orange-500
                                  hover:bg-orange-600
                                  text-white font-semibold
                                  px-6 py-3 rounded-xl
                                  transition">

                            Order Food

                        </a>

                    </div>

                `;

                return;

            }



            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/api/my-orders/?phone="
                        + encodeURIComponent(phone)
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load orders"
                    );

                }


                const orders =
                    await response.json();


                container.innerHTML = "";


                // No orders

                if (orders.length === 0) {

                    container.innerHTML = `

                        <div class="bg-white border border-gray-200
                                    rounded-2xl p-10 text-center
                                    shadow-sm">

                            <h2 class="text-2xl font-bold
                                       text-gray-900 mb-2">

                                No orders yet

                            </h2>

                            <p class="text-gray-500 mb-6">

                                Your placed orders will appear here.

                            </p>

                            <a href="index.html"
                               class="inline-block
                                      bg-orange-500
                                      hover:bg-orange-600
                                      text-white font-semibold
                                      px-6 py-3 rounded-xl
                                      transition">

                                Order Food

                            </a>

                        </div>

                    `;

                    return;

                }



                // Display orders

                orders.forEach(function(order) {


                    const orderCard =
                        document.createElement("div");


                    orderCard.className =
                        "bg-white border border-gray-200 " +
                        "rounded-2xl shadow-sm overflow-hidden";


                    let itemsHTML = "";


                    order.items.forEach(
                        function(item) {

                            itemsHTML += `

                                <div class="flex items-center
                                            justify-between
                                            py-3 border-b
                                            border-gray-100">

                                    <span class="text-gray-700">

                                        ${item.name}
                                        × ${item.quantity}

                                    </span>

                                    <strong class="text-gray-900">

                                        ₹${(
                                            item.price *
                                            item.quantity
                                        ).toFixed(2)}

                                    </strong>

                                </div>

                            `;

                        }
                    );



                    orderCard.innerHTML = `

                        <!-- Order Header -->

                        <div class="px-6 py-5
                                    bg-gray-50
                                    border-b border-gray-200
                                    flex flex-col sm:flex-row
                                    sm:items-center
                                    sm:justify-between
                                    gap-3">

                            <div>

                                <span class="text-sm
                                             text-gray-500">

                                    Order ID

                                </span>

                                <h2 class="text-xl font-bold
                                           text-gray-900">

                                    #${order.id}

                                </h2>

                            </div>


                            <div class="text-sm
                                        text-gray-500">

                                ${order.created_at}

                            </div>

                        </div>



                        <!-- Order Information -->

                        <div class="p-6">

                            <div class="grid grid-cols-1
                                        sm:grid-cols-2
                                        lg:grid-cols-4
                                        gap-5 mb-6">


                                <!-- Canteen -->

                                <div>

                                    <span class="block
                                                 text-xs
                                                 font-semibold
                                                 uppercase
                                                 tracking-wide
                                                 text-gray-400
                                                 mb-1">

                                        Canteen

                                    </span>

                                    <strong class="text-gray-900">

                                        ${order.canteen}

                                    </strong>

                                </div>



                                <!-- Customer -->

                                <div>

                                    <span class="block
                                                 text-xs
                                                 font-semibold
                                                 uppercase
                                                 tracking-wide
                                                 text-gray-400
                                                 mb-1">

                                        Customer

                                    </span>

                                    <strong class="text-gray-900">

                                        ${order.customer_name}

                                    </strong>

                                </div>



                                <!-- Pickup Location -->

                                <div>

                                    <span class="block
                                                 text-xs
                                                 font-semibold
                                                 uppercase
                                                 tracking-wide
                                                 text-gray-400
                                                 mb-1">

                                        Pickup Location

                                    </span>

                                    <strong class="text-gray-900">

                                        ${order.location}

                                    </strong>

                                </div>



                                <!-- Payment -->

                                <div>

                                    <span class="block
                                                 text-xs
                                                 font-semibold
                                                 uppercase
                                                 tracking-wide
                                                 text-gray-400
                                                 mb-1">

                                        Payment

                                    </span>

                                    <strong class="text-gray-900">

                                        ${order.payment}

                                    </strong>

                                </div>

                            </div>



                            <!-- Items -->

                            <div class="border-t
                                        border-gray-200
                                        pt-5">

                                <h3 class="text-lg font-semibold
                                           text-gray-900 mb-3">

                                    Items

                                </h3>


                                <div>

                                    ${itemsHTML}

                                </div>

                            </div>

                        </div>



                        <!-- Order Footer -->

                        <div class="px-6 py-5
                                    bg-gray-50
                                    border-t border-gray-200
                                    flex flex-col sm:flex-row
                                    sm:items-center
                                    sm:justify-between
                                    gap-4">


                            <!-- Status -->

                            <div>

                                <span class="block text-xs
                                             font-semibold
                                             uppercase
                                             tracking-wide
                                             text-gray-400
                                             mb-1">

                                    Status

                                </span>

                                <strong class="inline-block
                                               px-3 py-1
                                               rounded-full
                                               bg-orange-100
                                               text-orange-700
                                               text-sm">

                                    ${order.status}

                                </strong>

                            </div>



                            <!-- Total -->

                            <div class="sm:text-right">

                                <span class="block text-xs
                                             font-semibold
                                             uppercase
                                             tracking-wide
                                             text-gray-400
                                             mb-1">

                                    Total

                                </span>

                                <strong class="text-2xl
                                               font-bold
                                               text-orange-600">

                                    ₹${order.total.toFixed(2)}

                                </strong>

                            </div>


                        </div>

                    `;


                    container.appendChild(
                        orderCard
                    );

                });


            } catch (error) {

                console.error(
                    "Orders loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="bg-white border border-red-200
                                rounded-2xl p-10 text-center
                                shadow-sm">

                        <h2 class="text-2xl font-bold
                                   text-gray-900 mb-2">

                            Unable to load orders

                        </h2>

                        <p class="text-gray-500">

                            Please make sure the Django
                            server is running.

                        </p>

                    </div>

                `;

            }

        }



        loadOrders();

    </script>


</body>

</html>
