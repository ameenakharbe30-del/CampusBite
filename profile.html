<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <title>My Profile - KMES Canteen</title>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">

        <div class="max-w-6xl mx-auto px-6 py-4
                    flex items-center justify-between">

            <!-- Logo -->
            <a href="index.html"
               class="text-2xl font-bold text-orange-600">
                KMES Campus Canteen
            </a>

            <!-- Navigation -->
            <div class="flex items-center gap-6">

                <!-- My Orders -->
    <a href="orders.html"
       class="px-4 py-2.5 text-gray-700 font-semibold
              rounded-lg hover:bg-orange-50 hover:text-orange-600
              transition">
        My Orders
    </a>

    <!-- Cart -->
    <a href="cart.html"
       class="flex items-center gap-2
              bg-orange-500 hover:bg-orange-600
              text-white font-semibold
              px-4 py-2.5 rounded-lg transition">

        🛒
        <span>Cart</span>

        <span id="cart-count"
              class="bg-white text-orange-600
                     min-w-[24px] h-6 px-1.5
                     flex items-center justify-center
                     rounded-full text-sm font-bold">
            0
        </span>

    </a>
              
            </div>

        </div>

    </nav>


    <!-- Profile Section -->

    <main class="max-w-3xl mx-auto px-6 py-12">

        <!-- Heading -->

        <div class="text-center mb-8">

            <p class="text-sm font-semibold tracking-widest
                      text-orange-600 mb-2">
                ACCOUNT
            </p>

            <h1 class="text-4xl font-bold text-gray-900">
                My Profile
            </h1>

            <p class="text-gray-500 mt-2">
                Manage your student account
            </p>

        </div>


        <!-- Profile Card -->

        <div class="bg-white border border-gray-200
                    rounded-2xl shadow-sm overflow-hidden">

            <!-- Profile Header -->

            <div class="bg-orange-50 px-6 py-8 text-center">

                <div class="w-20 h-20 mx-auto
                            bg-orange-500 text-white
                            rounded-full flex items-center
                            justify-center text-3xl
                            font-bold">

                    👤

                </div>

                <h2 id="profile-name"
                    class="text-2xl font-bold text-gray-900 mt-4">
                    Student
                </h2>

                <p class="text-gray-500 mt-1">
                    KMES Canteen Student
                </p>

            </div>


            <!-- Profile Details -->

            <div class="p-6 space-y-5">

                <!-- Email -->

                <div class="border-b border-gray-100 pb-5">

                    <p class="text-xs font-semibold
                              uppercase tracking-wide
                              text-gray-400 mb-1">
                        Email
                    </p>

                    <p id="profile-email"
                       class="text-gray-900 font-medium">
                        Loading...
                    </p>

                </div>


                <!-- Username -->

                <div class="border-b border-gray-100 pb-5">

                    <p class="text-xs font-semibold
                              uppercase tracking-wide
                              text-gray-400 mb-1">
                        Username
                    </p>

                    <p id="profile-username"
                       class="text-gray-900 font-medium">
                        Loading...
                    </p>

                </div>


                <!-- Account Status -->

                <div>

                    <p class="text-xs font-semibold
                              uppercase tracking-wide
                              text-gray-400 mb-1">
                        Account Status
                    </p>

                    <span class="inline-block
                                 bg-green-100 text-green-700
                                 px-3 py-1 rounded-full
                                 text-sm font-semibold">
                        Active
                    </span>

                </div>

            </div>


            <!-- Logout -->

            <div class="px-6 py-6
                        bg-gray-50 border-t border-gray-200">

                <button onclick="logoutStudent()"
                        class="w-full border border-red-500
                               text-red-600 hover:bg-red-50
                               font-semibold py-3 rounded-xl
                               transition">

                    Logout

                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

    <script>

        // Load student information

        const studentEmail =
            localStorage.getItem("studentEmail");

        const studentUsername =
            localStorage.getItem("studentUsername");


        if (!studentEmail) {

            window.location.href =
                "student-login.html";

        } else {

            document.getElementById("profile-email")
                .textContent = studentEmail;

            document.getElementById("profile-username")
                .textContent =
                studentUsername || studentEmail;

        }


        // Logout

        function logoutStudent() {

            localStorage.removeItem("studentEmail");
            localStorage.removeItem("studentUsername");
            localStorage.removeItem("studentLoggedIn");
            localStorage.removeItem("customerPhone");

            window.location.href =
                "student-login.html";
        }

    </script>

</body>

</html>
