<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <title>Student Login - KMES Canteen</title>
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo / Heading -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14
                        bg-orange-500 text-white rounded-2xl text-2xl font-bold mb-4">
                K
            </div>

            <h1 class="text-3xl font-bold text-gray-900">
                Student Login
            </h1>

            <p class="text-gray-500 mt-2">
                Login to order from the campus canteen
            </p>
        </div>

        <!-- Login Card -->
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">

            <form id="student-login-form">

                <!-- Student Email / ID -->
                <div class="mb-5">
                    <label for="student-id"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Student ID / Email
                    </label>

                    <input
                        type="text"
                        id="student-id"
                        placeholder="Enter your Student ID or Email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl
                               outline-none focus:ring-2 focus:ring-orange-500
                               focus:border-orange-500"
                    >
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="password"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create your password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl
                               outline-none focus:ring-2 focus:ring-orange-500
                               focus:border-orange-500"
                    >
                </div>

                <!-- Error -->
                <p id="login-error"
                   class="hidden text-sm text-red-600 mb-4">
                </p>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-orange-500 hover:bg-orange-600
                           text-white font-semibold py-3 rounded-xl
                           transition">
                    Login
                </button>

            </form>

            <!-- Register -->
            <!-- <div class="text-center mt-6">
                <p class="text-sm text-gray-500">
                    Don't have an account?
                    <a href="student-register.html"
                       class="text-orange-600 font-semibold hover:text-orange-700">
                        Create Account
                    </a>
                </p>
            </div> -->

        </div>

        

    <script src="student-login.js"></script>

</body>
</html>
