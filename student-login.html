<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <title>Student Login - KMES Canteen</title>
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Logo / Heading -->
     <div class="text-center mb-8">

    <div class="flex items-center justify-center gap-2 mb-4">
        <span class="text-4xl font-black text-orange-500"></span>

        <span class="text-3xl font-extrabold tracking-tight text-gray-900">
            CamPus<span class="text-orange-500">biTe</span>
        </span>
    </div>

    <h1 class="text-3xl font-bold text-gray-900">
        Student Login
    </h1>

    <p class="text-gray-500 mt-2">
        Enter your email and create a password to continue
    </p>

</div>

        <!-- Login Card -->
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">

            <form id="student-login-form">

                <!-- Email -->
                <div class="mb-5">
                    <label for="student-email"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        id="student-email"
                        placeholder="Enter your email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl
                               outline-none focus:ring-2 focus:ring-orange-500
                               focus:border-orange-500"
                    >
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="password"
                           class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create your password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl
                               outline-none focus:ring-2 focus:ring-orange-500
                               focus:border-orange-500"
                    >
                </div>

                <!-- Error / Message -->
                <p id="login-error"
                   class="hidden text-sm text-red-600 mb-4">
                </p>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-orange-500 hover:bg-orange-600
                           text-white font-semibold py-3 rounded-xl
                           transition">
                    Continue
                </button>

            </form>

        </div>

    </div>

    <script src="student-login.js"></script>

</body>
</html>
