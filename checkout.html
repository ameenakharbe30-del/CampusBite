<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <title>Checkout - KMES Canteen</title>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 flex items-center justify-between bg-white px-6 py-4 shadow-md">

        <h2 class="text-xl font-bold text-orange-600">
            <a
                href="index.html"
                class="transition hover:text-orange-700">
                KMES Campus Canteen
            </a>
        </h2>

        <a
            href="cart.html"
            class="font-medium text-gray-600 transition hover:text-orange-600">
            ← Back to Cart
        </a>

    </nav>


    <!-- Checkout -->
    <main class="mx-auto max-w-6xl px-6 py-12">

        <!-- Page Heading -->
        <div class="mb-10">

            <p class="text-sm font-bold uppercase tracking-widest text-orange-500">
                Checkout
            </p>

            <h1 class="mt-2 text-4xl font-bold text-gray-900">
                Complete Your Order
            </h1>

            <p class="mt-3 text-gray-500">
                Enter your details and choose your payment method.
            </p>

        </div>


        <!-- Checkout Layout -->
        <div class="grid gap-8 lg:grid-cols-3">


            <!-- LEFT SIDE -->
            <section class="rounded-2xl bg-white p-6 shadow-md lg:col-span-2">

                <h2 class="text-xl font-bold text-gray-900">
                    Delivery Details
                </h2>


                <!-- Full Name -->
                <div class="mt-6">

                    <label
                        for="name"
                        class="mb-2 block text-sm font-semibold text-gray-700">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                    >

                </div>


                <!-- Phone -->
                <div class="mt-5">

                    <label
                        for="phone"
                        class="mb-2 block text-sm font-semibold text-gray-700">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-100"
                    >

                </div>


                <!-- Pickup Location -->
                <div class="mt-5">

                    <label
                        for="location"
                        class="mb-2 block text-sm font-semibold text-gray-700">
                        Pickup Location
                    </label>

                    <select
                        id="location"
                        class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-100">

                        <option value="">
                            Select pickup location
                        </option>

                        <option>
                            Main Canteen
                        </option>

                        <option>
                            College Building
                        </option>

                    </select>

                </div>


                <!-- Payment Method -->
                <h2 class="mt-8 text-xl font-bold text-gray-900">
                    Payment Method
                </h2>


                <div class="mt-4 space-y-3">

                    <!-- UPI -->
                    <label
                        class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 p-4 transition hover:border-orange-400 hover:bg-orange-50">

                        <input
                            type="radio"
                            name="payment"
                            value="UPI"
                            class="h-4 w-4 accent-orange-500"
                        >

                        <span class="font-medium text-gray-700">
                            📱 UPI
                        </span>

                    </label>


                    <!-- Cash -->
                    <label
                        class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 p-4 transition hover:border-orange-400 hover:bg-orange-50">

                        <input
                            type="radio"
                            name="payment"
                            value="Cash"
                            class="h-4 w-4 accent-orange-500"
                        >

                        <span class="font-medium text-gray-700">
                            💵 Pay at Canteen
                        </span>

                    </label>

                </div>


                <!-- Place Order -->
                <button
                    onclick="placeOrder()"
                    class="mt-8 w-full rounded-xl bg-orange-500 px-5 py-3 font-bold text-white transition hover:bg-orange-600 active:scale-[0.98]">

                    Place Order

                </button>

            </section>


            <!-- RIGHT SIDE -->
            <section class="h-fit rounded-2xl bg-white p-6 shadow-md">

                <h2 class="text-xl font-bold text-gray-900">
                    Order Summary
                </h2>


                <!-- Checkout Items -->
                <div
                    id="checkout-items"
                    class="mt-5 divide-y divide-gray-100">

                    <!-- Items will appear here -->

                </div>


                <hr class="my-5 border-gray-200">


                <!-- Subtotal -->
                <div class="flex items-center justify-between text-gray-600">

                    <span>
                        Subtotal
                    </span>

                    <span class="font-medium text-gray-900">
                        ₹<span id="checkout-total">0</span>
                    </span>

                </div>


                <!-- Service Fee -->
                <div class="mt-4 flex items-center justify-between text-gray-600">

                    <span>
                        Service Fee
                    </span>

                    <span class="font-medium text-gray-900">
                        ₹0
                    </span>

                </div>


                <hr class="my-5 border-gray-200">


                <!-- Final Total -->
                <div class="flex items-center justify-between">

                    <span class="text-lg font-bold text-gray-900">
                        Total
                    </span>

                    <strong class="text-2xl font-bold text-orange-600">
                        ₹<span id="final-total">0</span>
                    </strong>

                </div>

            </section>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
