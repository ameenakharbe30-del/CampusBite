<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="style.css">

    <title>GM College Canteen</title>

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <h2 class="logo">

            <a href="index.html" class="black">
                GM College Canteen
            </a>

        </h2>


        <div class="nav-right">

            <a href="orders.html" class="orders-link">
                My Orders
            </a>

            <a href="cart.html" class="cart-link">

                🛒 Cart

                <span id="cart-count">
                    0
                </span>

            </a>

        </div>

    </nav>



    <!-- Menu Heading -->

    <section class="menu-top">

        <p class="section-label">
            GM COLLEGE CANTEEN
        </p>

        <h1>
            Today's Menu
        </h1>

        <p>
            Freshly available today
        </p>

    </section>



    <!-- Menu -->

    <section class="menu-section">

        <div
            class="food-container"
            id="food-container">

            <p>
                Loading menu...
            </p>

        </div>

    </section>



    <!-- Footer -->

    <footer>

        <div class="footer-content">

            <h3>
                GM College Canteen
            </h3>

            <p>
                A simple and convenient way to order food on campus.
            </p>

            <p class="footer-bottom">
                © 2026 GM College Canteen |
                All Rights Reserved
            </p>

        </div>

    </footer>



    <script src="script.js"></script>


    <!-- LOAD GM MENU FROM DJANGO -->

    <script>

        async function loadGMMenu() {

            const container =
                document.getElementById("food-container");


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/gm-menu/"
                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load GM menu"
                    );

                }


                const items =
                    await response.json();


                container.innerHTML = "";


                if (items.length === 0) {

                    container.innerHTML = `
                        <p>
                            No menu items available today.
                        </p>
                    `;

                    return;

                }


                items.forEach(function(item) {

                    const foodItem =
                        document.createElement("div");


                    foodItem.className =
                        "food-item";


                    foodItem.innerHTML = `

                        <div class="food-image">
                            🍽️
                        </div>


                        <div class="food-details">

                            <h3>
                                ${item.name}
                            </h3>


                            <div class="food-bottom">

                                <strong>
                                    ₹${item.price}
                                </strong>


                                <button
                                    class="add-button"
                                    onclick="addToCart(
                                        ${item.id},
                                        '${item.name}',
                                        ${item.price},
                                        '${item.canteen}'
                                    )">

                                    Add +

                                </button>

                            </div>

                        </div>

                    `;


                    container.appendChild(foodItem);

                });


            } catch (error) {

                console.error(
                    "GM menu loading error:",
                    error
                );


                container.innerHTML = `

                    <p>

                        Unable to load GM menu.

                        Please make sure the Django
                        server is running.

                    </p>

                `;

            }

        }


        loadGMMenu();

    </script>


</body>

</html>
