<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="src/output.css">

    <title>KMES Canteen Staff Home</title>

</head>


<body class="min-h-screen bg-gray-50 text-gray-800">


    <!-- ===============================
         NAVBAR
    ================================ -->

    <nav class="bg-white border-b border-gray-200 shadow-sm">

        <div class="max-w-7xl mx-auto px-6 py-4
                    flex items-center justify-between">

            <!-- Logo -->

            <div class="flex items-center gap-3">

                <div class="w-11 h-11
                            bg-orange-100
                            rounded-xl
                            flex items-center justify-center
                            text-2xl">

                    🍴

                </div>


                <div>

                    <h2 class="text-xl font-bold text-gray-900">
                        KMES Canteen
                    </h2>

                    <p class="text-xs text-gray-500">
                        Staff Order Board
                    </p>

                </div>

            </div>


            <!-- Logout -->

            <button
                onclick="logoutStaff()"
                class="rounded-lg
                       border border-gray-200
                       px-4 py-2
                       font-medium
                       text-gray-600
                       transition
                       hover:border-red-200
                       hover:bg-red-50
                       hover:text-red-600">

                Logout

            </button>

        </div>

    </nav>



    <!-- ===============================
         WORKER HOME
    ================================ -->

    <main class="max-w-6xl mx-auto px-6 py-12">


        <!-- Heading -->

        <div class="mb-10">

            <p class="mb-3
                      text-sm
                      font-bold
                      tracking-[0.25em]
                      text-orange-600">

                KMES CANTEEN

            </p>


            <h1 class="mb-3
                       text-5xl
                       font-bold
                       text-gray-900">

                 Staff Dashboard

            </h1>


            <p class="text-lg text-gray-500">

                Manage incoming KMES Canteen orders.

            </p>

        </div>



        <!-- ===============================
             ORDERS BOX
        ================================ -->

        <div class="rounded-2xl
                    border border-gray-200
                    bg-white
                    p-8
                    shadow-sm
                    transition
                    hover:shadow-md">


            <h2 class="mb-3
                       text-2xl
                       font-bold
                       text-gray-900">

                Orders

            </h2>


            <p class="mb-6
                      text-gray-600">

                View and manage customer orders.

            </p>


            <button
                onclick="window.location.href='worker.html'"
                class="rounded-lg
                       bg-orange-500
                       px-5 py-2.5
                       font-semibold
                       text-white
                       transition
                       hover:bg-orange-600">

                View Orders

            </button>


        </div>


    </main>



    <!-- ===============================
         JAVASCRIPT
    ================================ -->

    <script src="worker.js"></script>

    <script src="logout.js"></script>

    <script src="staff-auth.js"></script>


    <!-- KMES CANTEEN LOGIN PROTECTION -->

    <script>

        if (
            localStorage.getItem("staffCanteen")
            !== "KMES Canteen"
        ) {

            window.location.href =
                "staff-login.html";

        }

    </script>


</body>

</html>
