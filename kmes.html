<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>KMES Canteen Menu</title>

</head>

<body>


    <!-- Navigation -->

    <nav class="navbar">

        <h2 class="logo">
            KMES Canteen
        </h2>

        <a href="cart.html" class="cart-link">
            🛒 Cart
            <span id="cart-count">0</span>
        </a>

    </nav>


    <!-- Menu -->

    <section class="menu-section">

        <div class="menu-heading">

            <div>

                <p class="section-label">
                    KMES CANTEEN
                </p>

                <h2>
                    Today's Menu
                </h2>

            </div>

            <p class="menu-note">
                Freshly available today
            </p>

        </div>



        <!-- Food Items -->

        <div class="food-container">


            <!-- Dhokla -->

            <div class="food-item">

                <div class="food-image">
                    🟨
                </div>

                <div class="food-details">

                    <h3>
                        Dhokla
                    </h3>

                    <div class="food-bottom">

                        <strong>
                            ₹20
                        </strong>

<button onclick="addToCart('Dhokla', 20, 'KMES Canteen')">
    Add +
</button>
                    </div>

                </div>

            </div>



            <!-- Samosa -->

            <div class="food-item">

                <div class="food-image">
                    🥟
                </div>

                <div class="food-details">

                    <h3>
                        Samosa
                    </h3>

                    <div class="food-bottom">

                        <strong>
                            ₹12
                        </strong>

                        <button onclick="addToCart('Samosa', 12,'KMES Canteen')">
                            Add +
                        </button>

                    </div>

                </div>

            </div>



            <!-- Vada Pav -->

            <div class="food-item">

                <div class="food-image">
                    🍔
                </div>

                <div class="food-details">

                    <h3>
                        Vada Pav
                    </h3>

                    <div class="food-bottom">

                        <strong>
                            ₹12
                        </strong>

                        <button onclick="addToCart('Vada Pav', 12,'KMES Canteen')">
                            Add +
                        </button>

                    </div>

                </div>

            </div>



            <!-- Noodles -->

            <div class="food-item">

                <div class="food-image">
                    🍜
                </div>

                <div class="food-details">

                    <h3>
                        Noodles
                    </h3>

                    <div class="food-bottom">

                        <strong>
                            ₹40
                        </strong>

                        <button onclick="addToCart('Noodles', 40,'KMES Canteen')">
                            Add +
                        </button>

                    </div>

                </div>

            </div>


        </div>

    </section>



    <!-- Footer -->

    <footer>
    <div class="footer-content">

        <h3>KMES Campus Canteen</h3>

        <p>
            A simple and convenient way to order food on campus.
        </p>

        <p class="footer-bottom">
            © 2026 KMES Campus Canteen | All Rights Reserved
        </p>

    </div>
</footer>



    <script src="script.js"></script>

</body>

</html>
